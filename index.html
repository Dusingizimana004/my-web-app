<?php
session_start(); include('db.php');
$message = ""; $msg_type = "";
if (isset($_POST['register'])) {
    $u = mysqli_real_escape_string($conn, trim($_POST['u_Name']));
    $p_hashed = password_hash(trim($_POST['u_Password']), PASSWORD_DEFAULT);
    mysqli_query($conn, "INSERT INTO Users (u_Name, u_Password) VALUES ('$u', '$p_hashed')");
    $message = "Account created!"; $msg_type = "success";
}
if (isset($_POST['login'])) {
    $u = mysqli_real_escape_string($conn, trim($_POST['u_Name']));
    $p = trim($_POST['u_Password']);
    $res = mysqli_query($conn, "SELECT * FROM Users WHERE u_Name='$u'");
    if ($row = mysqli_fetch_assoc($res)) {
        if (password_verify($p, $row['u_Password'])) {
            $_SESSION['auth'] = true; header("Location: dashboard.php"); exit();
        } else { $message = "Invalid password!"; $msg_type = "error"; }
    }
}
?>
